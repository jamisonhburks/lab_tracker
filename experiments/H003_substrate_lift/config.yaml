###############################################################################
# H003 — Substrate lift: does grounding make a small local model punch above
# its weight on Hetionet drug-repurposing (Compound–treats–Disease)?
#
# 2x2 design: {qwen3:14b (local), frontier (Claude)} x {bare, +substrate}.
# +substrate = AUGMENT (model keeps its knowledge AND is grounded/calibrated by
# the KG), not restrict. Anti-leakage: held-out CtD test edges removed from the
# graph the substrate sees, so it reasons over INDIRECT mechanism paths.
###############################################################################

experiment_id: H003
random_seeds: [11, 23, 42]        # >=3 independent replicates (CLAUDE.md min_runs)

kg_backend: hetionet              # data/hetionet-v1.0.json.bz2 (cached)
max_path_len: 3                   # substrate evidence: indirect paths up to 3 hops
precision_k: 10                   # precision@k
conf_high: 0.7                    # "confident" threshold for the confidently-wrong rate

# ANONYMIZE: replace entity NAMES with opaque per-pair IDs (Compound_1, Disease_1, Gene_2, …) —
# category kept, identity hidden; RELATION types stay real. This defeats the models' memorized
# public knowledge, so a BARE model is blind (~base-rate) and the substrate's mechanism paths are
# the only signal. It simulates the product's real case: a private, in-boundary KG no model has
# seen. Because bare is blind, plain RANDOM negatives suffice (no contaminated hard negatives).
anonymize: true

dataset:
  n_positives: 60
  n_negatives: 120
  hard_negative_frac: 0.0         # random negatives (contrast comes from bare being blind)

# Smoke config — proves the anonymized plumbing + that bare goes blind while substrate reasons
smoke:
  n_positives: 6
  n_negatives: 8
  hard_negative_frac: 0.0
  seeds: [11]

# The four arms. backend: ollama (local) | anthropic (SDK, needs ANTHROPIC_API_KEY) |
# frontier (resolves at runtime → anthropic if a key is set, else external cache).
arms:
  a: {label: "qwen3:14b bare",         backend: ollama,   model: "qwen3:14b",      substrate: false}
  b: {label: "qwen3:14b + substrate",  backend: ollama,   model: "qwen3:14b",      substrate: true}
  c: {label: "frontier bare",          backend: frontier, model: "claude-opus-4-8", substrate: false}
  d: {label: "frontier + substrate",   backend: frontier, model: "claude-opus-4-8", substrate: true}

# Where the external judge (harness/subagent stand-in for the SDK) exchanges work.
frontier_queue:   experiments/H003_substrate_lift/frontier_queue.jsonl
frontier_answers: experiments/H003_substrate_lift/frontier_answers.jsonl

results_dir: experiments/H003_substrate_lift/results
log_file:    experiments/H003_substrate_lift/logs/run.log

provenance:
  hypothesis_file: hypotheses/H003_substrate_lift.yaml
  script:          experiments/H003_substrate_lift/run.py
