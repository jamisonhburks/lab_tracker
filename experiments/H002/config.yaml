###############################################################################
# H002 — T2D–AD shared genes: covariate-adjusted OLS in bulk brain tissue
# Primary: GSE48350 (GPL570 Affymetrix)
# Replication: GSE122063 (GPL16699 Agilent)
###############################################################################

experiment_id: H002
random_seed: 42

# ---------------------------------------------------------------------------
# GEO download cache
# ---------------------------------------------------------------------------
geo_cache_dir: data/external/geo

# ---------------------------------------------------------------------------
# Output directories (relative to project root)
# ---------------------------------------------------------------------------
results_dir:  experiments/H002/results
figures_dir:  experiments/H002/results/figures
log_dir:      experiments/H002/logs
log_file:     experiments/H002/logs/run.log

# ---------------------------------------------------------------------------
# Analysis panel — 20 T2D–AD knowledge-graph shared genes
# ---------------------------------------------------------------------------
panel_genes:
  - IDE
  - IAPP
  - INS
  - APOE
  - AKT1
  - LEP
  - PPARGC1A
  - SOD1
  - PON1
  - OGG1
  - NOS3
  - BCL2
  - CALM1
  - IGF2
  - CASP8
  - AR
  - CTF1
  - ND1
  - AGER
  - APP   # 20th panel member (bridges amyloid and insulin axes)

central_genes:
  - IDE
  - IAPP
  - INS
  - APOE
  - AKT1

# ---------------------------------------------------------------------------
# Primary dataset — GSE48350 (GPL570)
# ---------------------------------------------------------------------------
primary:
  geo_id: GSE48350
  platform: GPL570
  # Diagnosis codes: C = control, AD = Alzheimer's disease
  # Parsed from sample characteristic: "individual: <id>, <DX>"
  diagnosis_field_pattern: "individual:"      # characteristic key containing diagnosis
  keep_diagnoses:                             # codes to retain (all others dropped)
    - C
    - AA    # actual code in GSE48350 SOFT file for Alzheimer cases (not AD as documented)
  diagnosis_map:                              # raw code → numeric label (0=control, 1=AD)
    C: 0
    AA: 1   # AA = Alzheimer Affected in GSE48350
  # Covariate characteristic field names (exact substring match in GSM characteristics)
  covariate_fields:
    region:  "brain region:"
    sex:     "gender:"
    age:     "age (yrs):"
  # Region values to retain (all four); used for robustness per-region check
  keep_regions:
    - hippocampus
    - entorhinal cortex
    - superior frontal gyrus
    - post-central gyrus
  # Region for cross-platform direction replication (must match frontal region in GSE122063)
  frontal_region_value: "superior frontal gyrus"
  # Probe→gene collapse: max-variance probe per gene per platform
  probe_collapse_method: max_variance   # fallback: mean

# ---------------------------------------------------------------------------
# Replication dataset — GSE122063 (GPL16699 Agilent)
# ---------------------------------------------------------------------------
replication:
  geo_id: GSE122063
  platform: GPL16699
  # Diagnosis parsed from "patient diagnosis:" characteristic
  diagnosis_field_pattern: "patient diagnosis:"
  keep_diagnoses:
    - "Alzheimer's disease"
    - Control
  diagnosis_map:
    "Alzheimer's disease": 1
    Control: 0
  # Exclude vascular dementia samples
  exclude_diagnoses:
    - "Vascular dementia"
  # Covariate characteristic field names
  covariate_fields:
    region:    "brain region:"
    sex:       "Sex:"
    age:       "age:"
    pmi:       "pmi:"
    subject_id: "subject id:"
  # Keep only frontal cortex; drop temporal cortex
  keep_region_substring: "frontal"
  # Technical replicate collapse: samples sharing subject_id + region are averaged
  # GSM titles ending in _TechRep1 / _TechRep2 are collapsed to subject mean
  tech_rep_pattern: "_TechRep"
  probe_collapse_method: max_variance

# ---------------------------------------------------------------------------
# Modelling
# ---------------------------------------------------------------------------
modeling:
  # Per-gene OLS formula components (built at runtime)
  primary_covariates:       [age, sex_male, region]   # region is one-hot C(region)
  replication_covariates:   [age, sex_male, pmi]      # no region covariate (frontal only)
  # Multiple-testing thresholds
  alpha: 0.05
  bonferroni_alpha: 0.05     # applied to 20-gene panel → threshold = 0.05/20
  bh_fdr_alpha: 0.05
  # Replication rule
  replication_nominal_alpha: 0.05  # same sign AND p < 0.05 in GSE122063 frontal
  # Bootstrap for effect-size CIs
  bootstrap_n_iterations: 1000
  bootstrap_ci_level: 0.95

# ---------------------------------------------------------------------------
# Power assessment
# ---------------------------------------------------------------------------
power:
  effect_sizes_to_check: [0.2, 0.3, 0.4]   # |Cohen's d| range typical of bulk brain
  alpha_power: 0.05

# ---------------------------------------------------------------------------
# Provenance
# ---------------------------------------------------------------------------
provenance:
  hypothesis_file: hypotheses/H002_t2d_ad_shared_genes_realdata.yaml
  script:         experiments/H002/run.py
  geo_base_url:   https://ftp.ncbi.nlm.nih.gov/geo/series/
