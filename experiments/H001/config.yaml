# experiments/H001/config.yaml
#
# All hyperparameters and run settings for experiment H001.
# Nothing in run.py is hardcoded — every tunable value lives here.

experiment_id: H001
hypothesis_id: H001

# ---------------------------------------------------------------------------
# Data paths (relative to project root)
# ---------------------------------------------------------------------------
data:
  synthetic_output_path: "data/processed/synthetic_ad_expression.csv"

# ---------------------------------------------------------------------------
# Shared-gene panel (20 T2D–AD KG-overlap genes)
# Source: biomedical knowledge-graph overlap of T2D and AD node neighbors.
# ---------------------------------------------------------------------------
gene_panel:
  - IDE
  - IAPP
  - INS
  - APOE
  - AKT1
  - LEP
  - PPARGC1A
  - SOD1
  - PON1
  - OGG1
  - NOS3
  - BCL2
  - CALM1
  - IGF2
  - CASP8
  - AR
  - CTF1
  - ND1
  - AGER
  - PIK3CA

# ---------------------------------------------------------------------------
# Ground-truth planted effects (used only in synthetic data generation)
#
# Genes listed here have a KNOWN differential expression effect between
# AD cases and controls. All other panel genes and all null genes have
# NO planted effect (mean shift = 0). This is the ground truth against
# which statistical power will be assessed.
#
# effect_magnitude: additive shift applied to log-expression in AD cases
#   (positive = higher in AD cases; log-scale, so ~0.5 ≈ ~65% fold-change)
# ---------------------------------------------------------------------------
planted_effects:
  IDE:       1.0    # mechanistically central: insulin-degrading enzyme
  IAPP:      0.9    # mechanistically central: amyloid-forming peptide
  INS:       0.85   # mechanistically central: insulin signaling
  APOE:      1.1    # mechanistically central: major AD genetic risk gene
  AKT1:      0.8    # mechanistically central: insulin/PI3K pathway
  LEP:       0.6    # leptin — adipokine, brain insulin resistance link
  PPARGC1A:  0.55   # mitochondrial biogenesis regulator

# ---------------------------------------------------------------------------
# Synthetic dataset parameters
# ---------------------------------------------------------------------------
synthetic:
  n_cases:        100      # number of AD case samples
  n_controls:     100      # number of control samples
  baseline_mean:  5.0      # log-expression baseline (mu, log-normal)
  baseline_std:   0.8      # within-gene expression noise (sigma, log-normal)
  n_control_genes: 30      # additional null genes appended to make
                            # multiple-testing realistic (no planted effect)

# ---------------------------------------------------------------------------
# Statistical testing
# ---------------------------------------------------------------------------
statistics:
  test:  "Welch"           # two-sample Welch t-test (unequal variance assumed)
  alpha: 0.05              # family-wise significance threshold
  effect_size_threshold: 0.5   # minimum |Cohen's d| to claim success

# ---------------------------------------------------------------------------
# Validity gates — PRE-REGISTERED, hypothesis-ORTHOGONAL interim checks.
# These verify the machinery (is the experiment working?), never the planted-gene
# result — so they catch pipeline bugs without steering the analysis.
# ---------------------------------------------------------------------------
validity_gates:
  cohort_integrity:
    min_per_arm: 20        # both case & control arms must be non-empty and >= 20
    severity: halt         # a broken cohort invalidates the run
  data_scale:
    kind: log
    max_expected: 30.0     # log-expression must not exceed ~30 (catches un-logged data)
    severity: halt
  negative_control:
    # the NULL_GENE_* set has NO planted effect -> should stay null (validates FDR
    # control, orthogonal to the planted/hypothesis genes)
    max_frac_significant: 0.10
    severity: flag

# ---------------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------------
seeds:
  - 42
  - 123
  - 7

# ---------------------------------------------------------------------------
# Output paths (relative to project root)
# ---------------------------------------------------------------------------
outputs:
  metrics_csv:    "experiments/H001/results/metrics.csv"
  figures_dir:    "experiments/H001/results/figures"
  log_file:       "experiments/H001/logs/run.log"
