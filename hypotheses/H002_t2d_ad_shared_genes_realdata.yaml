id: H002
title: "Differential expression of T2D–AD shared genes in REAL human brain tissue, prep-matched bulk-vs-bulk cross-dataset replication"
question: "Are the T2D–AD knowledge-graph shared genes (especially the mechanistically central IDE, IAPP, INS, APOE, AKT1) differentially expressed between Alzheimer's cases and controls in real human bulk brain tissue, after adjusting for covariates (age, sex, brain region) and multiple testing, with direction replication in an independent, preparation-matched, region-matched bulk-tissue dataset?"
null_hypothesis: "H₀: After covariate adjustment and panel-restricted multiple-testing correction, none of the central T2D–AD shared genes (IDE, IAPP, INS, APOE, AKT1) is differentially expressed between AD cases and age-matched cognitively-normal controls at BH-FDR < 0.05 in GSE48350 (bulk tissue), or any nominal signal fails to replicate in direction (same sign, p < 0.05) in the FRONTAL cortex of GSE122063 (bulk tissue)."
alternative_hypothesis: "H₁: At least one central T2D–AD shared gene (especially IDE or APOE) is differentially expressed between AD cases and age-matched normal controls at BH-FDR < 0.05 in GSE48350 (diagnosis coefficient in the covariate-adjusted linear model) AND replicates in direction (same sign, nominal p < 0.05) in the FRONTAL cortex of the independent bulk-tissue dataset GSE122063, consistent with a shared insulin-resistance / brain-metabolism mechanism."
data:
  source: "data/external/GSE48350 (primary; bulk tissue, GPL570 Affymetrix); data/external/GSE122063 (replication; bulk tissue, frontal cortex, GPL16699 Agilent)"
  type: "tabular"
  notes: >
    REAL public GEO microarray data, both BULK brain tissue (no laser capture). This is v2 and
    REPLACES the previous GSE5281 (laser-captured NEURONS) primary + GSE48350 (bulk) replication
    design: that pairing mismatched tissue preparation (neurons vs bulk), which would confound
    and discount any apparent replication. v2 fixes this with a PREP-MATCHED, REGION-MATCHED
    bulk-vs-bulk design.
    Primary: GSE48350 (n≈253, GPL570 Affymetrix U133 Plus 2.0, bulk tissue) — brain regions
    hippocampus, entorhinal cortex, superior frontal cortex, and post-central gyrus; cognitively
    normal controls aged 20–99 plus AD cases. Use cognitively-normal, AGE-MATCHED controls.
    Replication: GSE122063 (n≈136, GPL16699 Agilent, bulk tissue) — frontal and temporal cortex;
    AD vs non-demented controls (University of Michigan Brain Bank).
    Prep matched: both are BULK tissue, removing the neurons-vs-bulk confound.
    Region matched: replication is restricted to FRONTAL cortex — superior frontal cortex in
    GSE48350 ∩ frontal cortex in GSE122063.
    Cross-platform (GPL570 vs Agilent GPL16699): the panel is aligned by GENE SYMBOL with a
    per-platform probe→gene collapse (max-variance probe within each platform). Because the two
    platforms differ, exact effect magnitudes are not directly comparable; we replicate the SIGN
    of the diagnosis effect, not its magnitude. Cross-platform DIRECTION replication is therefore
    platform-independent and is a STRENGTH (guards against probe/platform artifacts), not a
    weakness.
    Both series are public and de-identified — fetched from GEO, so the data/raw local-only
    constraint does not apply; store fetched/processed matrices under data/external/ (and cleaned
    forms under data/processed/) rather than data/raw/. Expression assumed log-scaled/normalized
    per series (RMA-style for Affymetrix; Agilent processed signal for GSE122063); confirm and
    harmonize per-series before modeling. Analysis panel = the 20 T2D–AD KG-shared genes from
    H001 (IDE, IAPP, INS, APOE, AKT1, LEP, PPARGC1A, SOD1, PON1, OGG1, NOS3, BCL2, CALM1, IGF2,
    CASP8, AR, CTF1, ND1, AGER, and remaining panel members); central 5 = IDE, IAPP, INS, APOE,
    AKT1. min_runs is reinterpreted for real data (see below): "runs" are NOT synthetic seeds but
    ≥3 robustness checks — (1) within-GSE48350 per-brain-region consistency, (2) cross-dataset
    replication in GSE122063, (3) bootstrap CIs on effect sizes.
method: >
  Confirmatory, panel-restricted differential-expression analysis over the 20 T2D–AD KG-shared
  genes, prep-matched bulk-vs-bulk across two platforms:
  (1) Per-PLATFORM probe→gene collapse: map probes to gene symbols separately for GPL570
  (GSE48350) and GPL16699 (GSE122063); where a gene maps to multiple probes, collapse to a
  single per-gene value using the max-variance probe WITHIN each platform (pre-registered rule;
  mean as documented fallback). The analysis panel is then aligned across datasets by GENE
  SYMBOL, not by probe ID.
  (2) Per-gene LINEAR MODEL (NOT a two-sample t-test) with covariates. Primary (GSE48350):
  expression ~ diagnosis (AD vs age-matched normal control) + age + sex + brain region. Report
  the diagnosis coefficient, its 95% CI, and a standardized effect size (partial Cohen's d /
  standardized beta) for every panel gene.
  (3) Two-sided tests per gene (per-gene direction largely unknown a priori).
  (4) Multiple testing: PANEL-RESTRICTED and pre-registered (confirmatory over the 20 genes,
  NOT genome-wide discovery). Apply BOTH Bonferroni and Benjamini-Hochberg FDR over the 20
  panel p-values. Explicitly flag the KG-panel-selection caveat: inference is valid only within
  the panel and does not license genome-wide or causal claims.
  (5) Replication: any gene significant at BH-FDR < 0.05 in GSE48350 must replicate in DIRECTION
  (same sign of diagnosis coefficient) at nominal p < 0.05 in GSE122063, RESTRICTED TO FRONTAL
  cortex samples (superior frontal cortex ∩ frontal cortex). Because platforms differ, only the
  sign of the effect is required to match, not the magnitude.
  (6) Replication model (GSE122063, frontal cortex): expression ~ diagnosis (AD vs non-demented)
  + age + sex, on Agilent processed signal.
  (7) APOE caveat: microarray probes quantify APOE mRNA and cannot distinguish ε2/ε3/ε4 alleles;
  APOE genotype is NOT available here, so any APOE signal is transcript-level and must not be
  interpreted as an ε4 dosage / genotype effect. Flag prominently in reporting.
  (8) Power check: report an a-priori/post-hoc power assessment for the primary GSE48350
  analysis (given per-region n after age-matching) to detect the small transcriptomic effects
  typical of bulk brain (|d| ~ 0.2–0.4), so null findings can be interpreted against achievable
  power rather than assumed conclusive.
success_metric: >
  ≥1 of the central shared genes (especially IDE or APOE) is differentially expressed at
  BH-FDR < 0.05 in GSE48350 (covariate-adjusted diagnosis coefficient) AND replicates in
  direction (same sign, nominal p < 0.05) in the FRONTAL cortex of GSE122063. Report
  standardized effect sizes with 95% CI and BOTH Bonferroni- and BH-corrected p-values for ALL
  20 panel genes, plus the power assessment. Deliberately NO hard |Cohen's d| floor: real bulk
  brain-transcriptomic effects are frequently |d| < 0.3, so effect magnitude is reported with
  its CI rather than gated by a threshold (this relaxes H001's |d| ≥ 0.5 criterion, per the H001
  evaluator's warning that it is too strict for real transcriptomics). Because the two platforms
  differ, replication requires only matched SIGN of the diagnosis effect, not matched magnitude.
min_runs: 3
pre_registration:
  design: "Prep-matched, region-matched bulk-vs-bulk. Primary GSE48350 (bulk, GPL570); replication GSE122063 (bulk, GPL16699 Agilent), restricted to frontal cortex. v2 replaces the GSE5281/laser-captured-neurons design to remove the tissue-preparation confound. Cross-platform direction replication is treated as a strength (platform-independent), not a weakness."
  multiple_testing_scope: "Panel-restricted, confirmatory over exactly the 20 T2D–AD KG-shared genes; NOT genome-wide. Both Bonferroni and Benjamini-Hochberg applied over the 20 panel p-values (discovery in GSE48350)."
  region_restriction: "Replication is restricted to FRONTAL cortex only — superior frontal cortex in GSE48350 intersected with frontal cortex in GSE122063 — to keep the replication region-matched."
  test_directionality: "Two-sided per-gene tests (direction not fixed a priori)."
  covariate_set: "Primary (GSE48350): diagnosis (AD vs age-matched normal control) + age + sex + brain region. Replication (GSE122063, frontal cortex): diagnosis (AD vs non-demented) + age + sex. Controls are cognitively-normal and age-matched."
  probe_collapse_method: "Per-PLATFORM probe→gene mapping (GPL570 for GSE48350; GPL16699 for GSE122063). Collapse multiple probes per gene by max-variance probe WITHIN each platform (documented fallback: mean). Panel then aligned across datasets by GENE SYMBOL."
  effect_size_reporting: "Report diagnosis coefficient, 95% CI, and standardized effect size for all 20 panel genes; no hard |d| floor imposed. Cross-platform: sign is comparable, magnitude is not."
  replication_rule: "A gene significant at BH-FDR < 0.05 in GSE48350 counts as replicated only if the diagnosis coefficient has the SAME SIGN and nominal p < 0.05 in GSE122063 frontal cortex."
  apoe_genotype_caveat: "Microarray measures APOE mRNA and cannot resolve ε2/ε3/ε4 alleles; no APOE genotype is available. Any APOE result is transcript-level and must not be read as an ε4 genotype/dosage effect."
  power_check: "Report power to detect small bulk-brain effects (|d| ~ 0.2–0.4) given per-region n in GSE48350 after age-matching, so nulls are interpreted against achievable power."
  robustness_checks: "min_runs:3 reinterpreted as ≥3 robustness checks — within-GSE48350 per-brain-region consistency, cross-dataset direction replication (GSE122063 frontal cortex), and bootstrap CIs on effect sizes."
