id: H003
title: "Does the substrate make a small local model punch above its weight?"
question: >
  On a real drug-repurposing task (Hetionet Compound–treats–Disease prediction with the target
  edges held out of the graph), does grounding a small local model (qwen3:14b) in the substrate —
  indirect KG mechanism paths + a calibrated grounding grade — raise its ranking quality,
  calibration, and truthfulness to MATCH or beat a bare frontier model? This is the load-bearing
  commercial claim: the substrate, not the model, is where the value is.
null_hypothesis: >
  H₀: grounding gives no lift — (14b+substrate) ≤ (14b bare) on ranking quality, and (14b+substrate)
  < (frontier bare). The substrate does not make a small model punch above its weight.
alternative_hypothesis: >
  H₁: (14b+substrate) > (14b bare) on ranking quality (precision@k / AUROC) with a positive effect
  size, AND (14b+substrate) ≥ (frontier bare) — i.e. the grounded small model closes the gap to a
  bare frontier model. Secondary: the substrate lowers ECE and the hallucinated-mechanism rate for
  BOTH models.
data:
  source: "data/hetionet-v1.0.json.bz2"
  type: "mixed"   # knowledge graph (Hetionet) + LLM judgements
  notes: >
    Positives = Hetionet CtD (Compound–treats–Disease) edges (~755). Negatives are mostly HARD
    (~75%): plausible-but-false pairs where the compound binds a gene ASSOCIATED with the disease
    (a real CbG–DaG path) but does NOT treat it — the regime where a bare model confidently invents
    a mechanism and grounding should restrain it; the rest are easy (random) negatives. ANTI-LEAKAGE:
    held-out test CtD edges are removed from the graph the substrate arms see, so they reason over
    INDIRECT paths, never the direct answer. Hallucination + grade are judged against the FULL
    (oracle) graph. NOTE: because public drug indications are memorized by frontier models, this
    task's RANKING (AUROC) is near-ceiling for them; the discriminating axes are calibration and
    truthfulness, so those lead.
method: >
  A 2×2 design: {qwen3:14b (local), frontier (Claude)} × {bare, +substrate}. Each arm scores the
  same labelled pairs with a structured judgement {treats, confidence, mechanism}. Bare = model on
  drug+disease names only. +substrate AUGMENTS: same model + KG indirect-path evidence + grounding
  grade in context, instructed to keep its knowledge but CALIBRATE confidence to the graph's support.
  Metrics per arm: ECE (calibration); confidently_wrong_rate (high-confidence false alarms / missed
  positives); hallucination_rate (cites a mechanism not on any ≤3-hop KG path — closed-world, so it
  conflates invention with KG incompleteness); plus precision@k / AUROC / AUPRC (ranking, secondary).
  A per-grounding-grade breakdown checks that substrate confidence tracks the grade. Mean±sd over seeds.
success_metric: >
  PRIMARY (calibration + truthfulness — the substrate's actual claim): across ≥3 seeds, both
  (14b+substrate) and (frontier+substrate) show LOWER ECE, confidently_wrong_rate, and
  hallucination_rate than their bare counterparts, with a negative effect size (Cohen's d) surviving
  BH-FDR + Bonferroni across the arm comparisons. SECONDARY: (14b+substrate) ranking (AUROC/AUPRC)
  does not degrade materially vs (14b bare), and per-grade confidence is monotone in grounding grade
  (grounded > weakly_grounded > novel_unverified). The claim is FALSIFIED if grounding does not
  improve the local model's calibration/truthfulness.
min_runs: 3
created: 2026-08-16
status: approved
